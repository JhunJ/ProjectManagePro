services:
  postgres:
    image: postgres:16-alpine
    container_name: pmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projectmanagepro
    ports:
      # Host 5433 avoids conflict with an existing PostgreSQL service on 5432.
      - "5433:5432"
    volumes:
      - pmp_pg_data:/var/lib/postgresql/data

volumes:
  pmp_pg_data:
